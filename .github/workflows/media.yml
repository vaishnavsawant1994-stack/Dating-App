name: Media

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  media-service:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: test
      SERVICE_NAME: media
      LOG_LEVEL: error
      MEDIA_S3_ENDPOINT: http://127.0.0.1:9000
      MEDIA_S3_REGION: us-east-1
      MEDIA_S3_FORCE_PATH_STYLE: 'true'
      MEDIA_S3_ACCESS_KEY_ID: test-access
      MEDIA_S3_SECRET_ACCESS_KEY: test-secret
      MEDIA_S3_SSE: AES256
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: corepack prepare pnpm@12.11.2 --activate
      - name: Resolve PR dependencies under active policies
        if: github.event_name == 'pull_request'
        run: |
          pnpm clean --lockfile
          pnpm install --no-frozen-lockfile
      - name: Install committed dependencies
        if: github.event_name != 'pull_request'
        run: pnpm install --frozen-lockfile
      - run: pnpm --filter @together/media lint
      - run: pnpm --filter @together/media typecheck
      - run: pnpm --filter @together/media test:unit
      - run: pnpm --filter @together/media test:integration

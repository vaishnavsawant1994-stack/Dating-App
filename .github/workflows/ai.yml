name: AI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ai-service:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: test
      SERVICE_NAME: ai
      LOG_LEVEL: error
      AI_PROVIDER: fake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: corepack prepare pnpm@12.11.2 --activate
      - name: Resolve PR dependencies under active policies
        if: github.event_name == 'pull_request'
        run: |
          pnpm clean --lockfile
          pnpm install --no-frozen-lockfile
      - name: Install committed dependencies
        if: github.event_name != 'pull_request'
        run: pnpm install --frozen-lockfile
      - run: pnpm --filter @together/ai lint
      - run: pnpm --filter @together/ai typecheck
      - run: pnpm --filter @together/ai test:unit
      - run: pnpm --filter @together/ai test:integration

name: API

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  core-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: together
          POSTGRES_PASSWORD: together
          POSTGRES_DB: together_api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U together -d together_api_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      SERVICE_NAME: api
      LOG_LEVEL: error
      DATABASE_URL: postgres://together:together@127.0.0.1:5432/together_api_test
      BUILD_ID: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Activate pinned pnpm
        run: corepack prepare pnpm@12.11.2 --activate

      - name: Resolve PR dependencies under active policies
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          pnpm clean --lockfile
          pnpm install --no-frozen-lockfile

      - name: Install committed dependencies
        if: github.event_name != 'pull_request'
        run: pnpm install --frozen-lockfile

      - name: Lint API
        run: pnpm --filter @together/api lint

      - name: Typecheck API
        run: pnpm --filter @together/api typecheck

      - name: Run unit tests
        run: pnpm --filter @together/api test:unit

      - name: Run PostgreSQL integration test
        run: pnpm --filter @together/api test:integration
